# Render Blueprint for Online Safety Guard.
#
# If the service already exists (created from the dashboard), this file is only
# documentation: mirror the env vars below in the dashboard. To create a fresh
# stack from it: Render → New → Blueprint → select the repo.
#
# The web service serves the React app, the API and the Outlook add-in pages on
# one origin (https://online-safety-guard.onrender.com), so the manifest, the
# OAuth redirect URIs and the task pane all share that URL.
services:
  - type: web
    name: online-safety-guard
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.20.0"
      # Postgres keeps accounts, connections, history and notifications across deploys.
      - key: DATABASE_URL
        fromDatabase:
          name: online-safety-guard-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Fill these in the dashboard (Environment → Add) — never commit values.
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: URLSCAN_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: SYNC_INTERVAL_MINUTES
        value: "15"

databases:
  - name: online-safety-guard-db
    plan: free
    databaseName: online_safety_guard
    user: osg
